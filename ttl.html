<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Truths and a Lie</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#000; --muted:#3f3f46; --sky:#38bdf8; --ok:#86efac; --bad:#fca5a5; color-scheme: light dark; }
  body{--b1:#bae6fd;--b2:#c4b5fd;--b3:#fde68a}
  body[data-phase=writing]{--b1:#fde68a;--b2:#fdba74;--b3:#a7f3d0}
  body[data-phase=voting]{--b1:#fbcfe8;--b2:#c4b5fd;--b3:#bae6fd}
  body[data-phase=reveal]{--b1:#bbf7d0;--b2:#fde68a;--b3:#fbcfe8}
  body[data-phase=podium]{--b1:#fed7aa;--b2:#fde047;--b3:#fda4af}
  @media (prefers-color-scheme: dark) { :root { --bg:#09090b; --ink:#fff; --muted:#d4d4d8; }
    body{--b1:#0c4a6e;--b2:#4c1d95;--b3:#713f12}
    body[data-phase=writing]{--b1:#713f12;--b2:#7c2d12;--b3:#14532d}
    body[data-phase=voting]{--b1:#831843;--b2:#4c1d95;--b3:#0c4a6e}
    body[data-phase=reveal]{--b1:#14532d;--b2:#713f12;--b3:#831843}
    body[data-phase=podium]{--b1:#7c2d12;--b2:#854d0e;--b3:#881337} }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 10% 15%, var(--b2) 0 110px, transparent 111px), radial-gradient(circle at 92% 75%, var(--b3) 0 160px, transparent 161px), radial-gradient(circle at 70% 8%, var(--b3) 0 60px, transparent 61px), var(--b1); background-attachment:fixed; color:var(--ink); font-family:'Bricolage Grotesque',system-ui,sans-serif; line-height:1.4; }
  main { max-width:760px; margin:0 auto; padding:56px 18px 90px; }
  h1 { font-size:clamp(1.8rem,6vw,2.8rem); font-weight:800; margin:0 0 6px; line-height:1.05; }
  h2 { font-size:1.3rem; margin:0 0 10px; }
  .back { position:fixed; top:10px; left:10px; font:800 12px system-ui; background:#000; color:#fff; padding:5px 12px; border-radius:99px; text-decoration:none; z-index:5; }
  .box { border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink); background:var(--bg); padding:18px; margin:18px 0; }
  .muted { color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:2px solid var(--ink); padding:3px 10px; font-weight:800; background:var(--sky); color:#000; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; border:3px solid var(--ink); background:#000; color:#fff; font-weight:800; padding:10px 18px; }
  @media (prefers-color-scheme: dark) { button.main { background:#fff; color:#000; } }
  button.main:disabled { opacity:.35; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--ink); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--sky); outline-offset:2px; }
  input[type=text], input[type=number], textarea { width:100%; padding:10px; border:3px solid var(--ink); background:var(--bg); }
  .avs { display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr)); gap:8px; margin:10px 0 16px; }
  .av { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; padding:0; font-size:1.8rem; line-height:1; background:transparent; border:3px solid transparent; color:inherit; }
  .av.on { border-color:var(--ink); background:var(--sky); }
  .row { display:flex; gap:10px; align-items:center; margin:10px 0; flex-wrap:wrap; }
  .line { display:flex; gap:10px; align-items:flex-start; margin:10px 0; }
  .line input[type=radio] { margin-top:14px; width:20px; height:20px; accent-color:#000; }
  .opts { list-style:none; padding:0; margin:0; }
  .opt, .opts li { display:flex; gap:12px; width:100%; text-align:left; margin:10px 0; padding:14px; font-size:1.1rem; border:3px solid var(--ink); background:var(--bg); color:var(--ink); }
  .opt.sel { background:var(--sky); color:#000; }
  .opts li.lie { background:var(--bad); color:#000; } .opts li.truth { background:var(--ok); color:#000; }
  .timer { font-size:2.4rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .big { font-size:1.5rem; font-weight:800; }
  .rank { display:flex; gap:12px; padding:10px 0; border-bottom:2px solid var(--ink); font-weight:800; font-size:1.2rem; }
  .rank.me { background:var(--sky); color:#000; padding-left:8px; }
  .rank .s { margin-left:auto; }
  .fab { position:fixed; right:12px; bottom:12px; z-index:6; background:var(--bg); box-shadow:4px 4px 0 var(--ink); }
  .x { padding:2px 8px; border:none; background:transparent; color:#000; font-weight:800; font-size:1rem; }
  .qr { display:inline-block; background:#fff; padding:12px; border:3px solid #000; margin:6px 0; }
  #err { position:fixed; left:0; right:0; bottom:0; background:#fde047; color:#000; padding:10px 16px; font-weight:500; display:none; z-index:9; }
</style>
</head>
<body>
<a class="back" href="./">← Juegos</a>
<main><h1>Two Truths and a Lie <small style="font-size:.9rem;font-weight:500">v7</small></h1><div id="app"><p class="muted">Cargando…</p></div></main>
<div id="err" role="alert"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { supabase, ensureRoom, joinRoom, subscribeRoom, patchRoom, roomCodeFromUrl } from "./supabase.js";

const CODE = roomCodeFromUrl("TTL-1001");
const AV = ["🦊","🐼","🐸","🦄","🐙","🦁","🐯","🐵","🐧","🦉","🐢","🐳","🦋","🐝","🦖","👾"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LET = 'ABC';

let sid; try { sid = localStorage.getItem('ttl_sid'); if (!sid) { sid = crypto.randomUUID(); localStorage.setItem('ttl_sid', sid); } } catch { sid = crypto.randomUUID(); }
let hostMode = false;
try { hostMode = localStorage.getItem('ttl_host_' + CODE) === '1' || new URLSearchParams(location.search).get('host') === '1'; } catch {}
let S = { room:null, players:[], items:[], votes:[] }, me = null, skew = 0, lastKey = '', pickedAv = AV[0];

function showError(e) {
  const t = $('#err'); if (!e) { t.style.display = 'none'; return; }
  const m = (e.message || String(e));
  t.textContent = (/hub_|relation|schema|42P01|42501|PGRST/.test(m + (e.code||'')) ? 'Database missing: run setup_database.sql and enable the game. ' : '') + m;
  t.style.display = 'block';
}

async function refresh() {
  const [r, p, i, v] = await Promise.all([
    supabase.from('hub_rooms').select('*').eq('code', CODE).maybeSingle(),
    supabase.from('hub_players').select('*').eq('room_code', CODE).order('joined_at'),
    supabase.from('hub_items').select('*').eq('room_code', CODE).eq('kind', 'statement'),
    supabase.from('hub_votes').select('*').eq('room_code', CODE)
  ]);
  const err = r.error || p.error || i.error || v.error;
  if (err) { showError(err); return; }
  showError(null);
  S = { room: r.data, players: p.data || [], items: i.data || [], votes: v.data || [] };
  me = S.players.find(x => x.session_id === sid) || null;
  render();
}
let deb; const soon = () => { clearTimeout(deb); deb = setTimeout(refresh, 150); };

const st = () => (S.room && S.room.state) || {};
const curItem = () => S.items.find(i => i.id === st().current_item_id);
const byId = id => S.players.find(p => p.id === id);
const pTag = p => p ? `${esc(p.avatar || '🙂')} ${esc(p.name)}` : '?';
const remaining = () => { const e = st().ends_at; return e ? Math.max(0, Math.ceil((new Date(e).getTime() - (Date.now() + skew)) / 1000)) : 0; };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const votesFor = id => S.votes.filter(v => v.item_id === id);
const eligible = it => S.players.filter(p => p.id !== it.player_id).length;

let openId = null;
function countText() {
  if (S.room.status === 'writing') return `${S.items.length}/${S.players.length} submitted`;
  const need = S.items.reduce((a, i) => a + eligible(i), 0);
  return `${S.votes.length}/${need} votes`;
}
function viewKey() {
  if (!S.room) return 'none';
  const rv = (st().revealed || []).length;
  const mine = me ? S.votes.filter(v => v.voter_id === me.id).map(v => v.item_id + ':' + v.data.guess).join(',') : '';
  const sub = me ? S.items.some(i => i.player_id === me.id) : false;
  const sc = ['reveal', 'podium'].includes(S.room.status) ? S.players.reduce((a, p) => a + p.score, 0) : '';
  return [S.room.status, hostMode, me && me.id, rv, openId, sub, mine, hostMode && S.room.status === 'voting' ? S.votes.length : '', sc].join('|');
}
function render() {
  if (!S.room) { $('#app').innerHTML = '<p class="muted">Could not open the room.</p>'; return; }
  const k = viewKey();
  if (S.room.status !== 'voting') openId = null;
  document.body.dataset.phase = S.room.status;
  if (k !== lastKey) { lastKey = k; $('#app').innerHTML = view(); qr(); }
  light();
}
function light() {
  const pl = $('#plist'); if (pl) pl.innerHTML = S.players.map(p => `<span class="chip">${pTag(p)}${hostMode ? ` <button class="x" data-kick="${p.id}" aria-label="Remove ${esc(p.name)}">✕</button>` : ''}</span>`).join('') || '<i class="muted">Nobody yet…</i>';
  const c = $('#count'); if (c) c.textContent = countText();
  const sw = $('#startwrite'); if (sw) sw.disabled = S.players.length < 2;
  const sv = $('#startvote'); if (sv) sv.disabled = S.items.length < 2;
  tick();
}
function qr() {
  const el = $('#qr'); if (!el || el.dataset.done) return;
  if (!window.QRCode) { el.textContent = '(QR unavailable: use the link)'; return; }
  el.dataset.done = '1';
  new QRCode(el, { text: location.origin + location.pathname + '?room=' + encodeURIComponent(CODE), width: 230, height: 230, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}
function tick() {
  const t = $('#timer'); if (t) t.textContent = fmt(remaining());
  const f = $('#l0');
  if (f && !f.readOnly && S.room && S.room.status === 'writing' && st().ends_at && remaining() <= 0) lockWriting();
}
function lockWriting() {
  [0, 1, 2].forEach(i => { const el = $('#l' + i); el.readOnly = true; el.style.opacity = '.7'; });
  const b = document.querySelector('[data-act=submit]'); if (b) b.textContent = 'Send what I wrote';
  const n = $('#late'); if (n) n.hidden = false;
}
setInterval(tick, 500);

function view() {
  const s = S.room.status;
  if (hostMode) return hostView(s) + '<button class="ghost fab" data-act="reset">↺ Reset game</button>';
  if (!me) return joinView();
  return playerView(s);
}

function joinView() {
  return `<div class="box"><h2>Join room <code>${esc(CODE)}</code></h2>
    <label for="nm"><b>Your name</b></label><input id="nm" type="text" maxlength="30" autocomplete="off">
    <p><b>Your avatar</b></p><div class="avs">${AV.map(a => `<button type="button" class="av ${a === pickedAv ? 'on' : ''}" data-av="${a}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
    <button class="main" data-act="join">Join</button></div>
    <p><button class="ghost" data-act="host">I'm the host (projector)</button></p>`;
}

function hostView(s) {
  const link = location.origin + location.pathname + '?room=' + encodeURIComponent(CODE);
  const clear = '<button class="ghost" data-act="clearnames">🧽 Clear names</button>';
  if (s === 'lobby') return `<div class="box"><h2>Room <code>${esc(CODE)}</code></h2>
    <p class="muted">Scan the QR or go to:<br><b>${esc(link)}</b></p><div class="qr" id="qr"></div><h2>Players</h2><div class="chips" id="plist"></div></div>
    <div class="row"><label for="secs"><b>Seconds to write</b></label><input id="secs" type="number" min="30" max="900" value="120" style="width:110px">
    <button class="main" id="startwrite" data-act="startwrite" disabled>Start writing</button>${clear}</div>
    <p class="muted">At least 2 players needed. Tap ✕ to remove one, or 🧽 to remove everyone.</p>`;
  if (s === 'writing') return `<div class="box"><h2>Writing…</h2><div class="timer" id="timer"></div><p class="big" id="count"></p></div>
    <button class="main" id="startvote" data-act="startvote" disabled>Start voting</button>
    <p class="muted">At least 2 submitted statements needed.</p>`;
  if (s === 'voting') return `<div class="box"><h2>Voting…</h2><p class="muted">Each player freely chooses which student to vote on.</p><p class="big" id="count"></p>
    ${S.items.map(it => `<div class="rank"><span>${pTag(byId(it.player_id))}</span><span class="s">${votesFor(it.id).length}/${eligible(it)}</span></div>`).join('')}</div>
    <button class="main" data-act="closevote">Close voting and reveal</button>`;
  if (s === 'reveal') { const rv = st().revealed || [];
    return `<p class="muted">Reveal the statements one by one.</p>` + S.items.map(it => rv.includes(it.id)
      ? `<div class="box"><p class="muted">From ${pTag(byId(it.player_id))}</p>${revealList(it)}${resultList(it)}</div>`
      : `<div class="box"><p class="big">${pTag(byId(it.player_id))}</p><button class="main" data-reveal="${it.id}">Reveal the lie</button></div>`).join('')
      + `<button class="main" data-act="podium">See podium</button>`; }
  if (s === 'podium') return `<div class="box"><h2>🏆 Podium</h2>${ranking()}</div><div class="row"><button class="main" data-act="reset">New game</button>${clear}</div>`;
  return '<p class="muted">Waiting…</p>';
}

function revealList(it) {
  return `<ul class="opts">${it.data.lines.map((l, i) => `<li class="${i === it.data.lie_index ? 'lie' : 'truth'}"><b>${LET[i]}</b> ${esc(l)} ${i === it.data.lie_index ? '— <em>THE LIE</em>' : '✓'}</li>`).join('')}</ul>`;
}
function resultList(it) {
  const vs = votesFor(it.id);
  if (!vs.length) return '<p class="muted">Nobody voted.</p>';
  return `<div class="chips">${vs.map(v => `<span class="chip" style="background:${v.data.guess === it.data.lie_index ? 'var(--ok)' : 'var(--bad)'}">${pTag(byId(v.voter_id))} ${v.data.guess === it.data.lie_index ? '✓' : '✗'}</span>`).join('')}</div>`;
}
function ranking() {
  return [...S.players].sort((a, b) => b.score - a.score).map((p, i) =>
    `<div class="rank ${me && p.id === me.id ? 'me' : ''}"><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'}</span><span>${pTag(p)}</span><span class="s">${p.score}</span></div>`).join('');
}

function myMsg(it) {
  const mv = votesFor(it.id).find(v => v.voter_id === me.id);
  const wrong = votesFor(it.id).filter(v => v.data.guess !== it.data.lie_index).length;
  return it.player_id === me.id ? `You fooled ${wrong} person(s): +${wrong * 50}` : !mv ? 'You did not vote on this one' : mv.data.guess === it.data.lie_index ? 'Correct! +100' : 'You were fooled 😅';
}
function playerView(s) {
  const hello = `<p class="muted">Playing as ${pTag(me)}</p>`;
  if (s === 'lobby') return `${hello}<div class="box"><h2>You're in 🎉</h2><p>Wait for the game to start.</p><div class="chips" id="plist"></div></div>`;
  if (s === 'writing') {
    if (S.items.some(i => i.player_id === me.id)) return `${hello}<div class="box"><h2>Sent ✓</h2><p>Wait for the others.</p><div class="timer" id="timer"></div></div>`;
    return `${hello}<div class="box"><div class="timer" id="timer"></div><h2>Write 2 truths and 1 lie</h2>
      <p class="muted">Tick the circle next to the lie.</p>
      <p id="late" class="big" hidden>⏰ Time's up. You can't keep writing, but you can send what you have.</p>
      ${[0, 1, 2].map(i => `<div class="line"><input type="radio" name="lie" value="${i}" aria-label="Mark statement ${i + 1} as the lie"><input id="l${i}" type="text" maxlength="140" placeholder="Statement ${i + 1}" autocomplete="off"></div>`).join('')}
      <button class="main" data-act="submit">Send</button></div>`;
  }
  if (s === 'voting') {
    const others = S.items.filter(i => i.player_id !== me.id);
    const myv = id => votesFor(id).find(v => v.voter_id === me.id);
    const open = others.find(i => i.id === openId);
    if (open) { const mv = myv(open.id);
      return `${hello}<div class="box"><button class="ghost" data-act="back">← Back to the list</button>
        <p class="muted">From ${pTag(byId(open.player_id))} · which one is the lie?</p>
        ${open.data.lines.map((l, i) => `<button class="opt ${mv && mv.data.guess === i ? 'sel' : ''}" data-guess="${i}"><b>${LET[i]}</b> ${esc(l)}</button>`).join('')}
        <p class="muted">${mv ? 'Vote sent. You can change it until voting closes.' : 'Tap an option.'}</p></div>`; }
    const done = others.filter(i => myv(i.id)).length;
    return `${hello}<div class="box"><h2>Choose who to vote on</h2><p class="muted">You've voted on ${done} of ${others.length}. Open any student, in any order.</p>
      ${others.map(i => `<button class="opt ${myv(i.id) ? 'sel' : ''}" data-open="${i.id}">${pTag(byId(i.player_id))}<span style="margin-left:auto">${myv(i.id) ? '✓ Voted' : 'Pending'}</span></button>`).join('') || '<p class="muted">No statements from others yet.</p>'}</div>`;
  }
  if (s === 'reveal') { const rv = st().revealed || [];
    return hello + S.items.map(it => rv.includes(it.id)
      ? `<div class="box"><p class="muted">From ${pTag(byId(it.player_id))}</p><p class="big">${myMsg(it)}</p>${revealList(it)}</div>`
      : `<div class="box"><p class="big">${pTag(byId(it.player_id))}</p><p class="muted">🔒 Waiting for the reveal…</p></div>`).join(''); }
  if (s === 'podium') return `${hello}<div class="box"><h2>🏆 Podium</h2>${ranking()}</div>`;
  return `${hello}<p class="muted">Waiting…</p>`;
}

// ---- actions ----
async function revealItem(id) {
  await refresh();
  const it = S.items.find(i => i.id === id); if (!it) return;
  const done = st().scored || [], rv = st().revealed || [];
  if (!done.includes(id)) {
    const lie = it.data.lie_index, add = {}; let wrong = 0;
    votesFor(id).forEach(v => { if (v.data.guess === lie) add[v.voter_id] = (add[v.voter_id] || 0) + 100; else wrong++; });
    if (wrong) add[it.player_id] = (add[it.player_id] || 0) + 50 * wrong;
    const res = await Promise.all(Object.entries(add).map(([pid, pts]) =>
      supabase.from('hub_players').update({ score: (byId(pid)?.score || 0) + pts }).eq('id', pid)));
    const bad = res.find(r => r.error); if (bad) { showError(bad.error); return; }
  }
  await patchRoom(CODE, { revealed: [...new Set([...rv, id])], scored: [...new Set([...done, id])] });
  refresh();
}
const actions = {
  host() { try { localStorage.setItem('ttl_host_' + CODE, '1'); } catch {} hostMode = true; lastKey = ''; render(); },
  async join() {
    const name = $('#nm').value.trim(); if (!name) { $('#nm').focus(); return; }
    const { error } = await joinRoom(CODE, sid, name, { avatar: pickedAv, status: 'joined' });
    if (error) return showError(error);
    refresh();
  },
  async startwrite() {
    const secs = Math.min(900, Math.max(30, parseInt($('#secs').value, 10) || 120));
    await supabase.from('hub_items').delete().eq('room_code', CODE);
    const { error } = await supabase.rpc('hub_start_phase', { p_code: CODE, p_status: 'writing', p_secs: secs, p_reset: { revealed: [], scored: [] } });
    if (error) showError(error); refresh();
  },
  async submit() {
    if (S.room.status !== 'writing') return showError({ message: 'Writing has ended.' });
    const late = st().ends_at && remaining() <= 0;
    let lines = [0, 1, 2].map(i => $('#l' + i).value.trim());
    const lie = document.querySelector('input[name=lie]:checked');
    if (!lie) return showError({ message: 'Mark which one is the lie.' });
    if (late) {
      if (lines.every(l => !l)) return showError({ message: 'There is nothing written to send.' });
      lines = lines.map(l => l || '(not written)');
    } else if (lines.some(l => !l)) return showError({ message: 'Write all 3 statements and mark the lie.' });
    await supabase.from('hub_items').delete().eq('room_code', CODE).eq('player_id', me.id).eq('kind', 'statement');
    const { error } = await supabase.from('hub_items').insert([{ room_code: CODE, player_id: me.id, kind: 'statement', data: { lines, lie_index: +lie.value } }]);
    if (error) showError(error); refresh();
  },
  async startvote() { await patchRoom(CODE, { status: 'voting', revealed: [], scored: [] }); refresh(); },
  async closevote() { await patchRoom(CODE, { status: 'reveal' }); refresh(); },
  async podium() { await patchRoom(CODE, { status: 'podium' }); refresh(); },
  back() { openId = null; render(); },
  async clearnames() {
    if (!confirm('Remove all players (and their statements) and return to the lobby?')) return;
    const { error } = await supabase.from('hub_players').delete().eq('room_code', CODE);
    if (error) return showError(error);
    await patchRoom(CODE, { status: 'lobby', revealed: [], scored: [], ends_at: null }); refresh();
  },
  async reset() {
    if (!confirm('Reset the whole game? All statements, votes and scores will be deleted and everyone goes back to the lobby. Players stay in the room.')) return;
    await supabase.from('hub_items').delete().eq('room_code', CODE);
    await supabase.from('hub_players').update({ score: 0 }).eq('room_code', CODE);
    await patchRoom(CODE, { status: 'lobby', revealed: [], scored: [], ends_at: null }); refresh();
  }
};
document.addEventListener('click', async e => {
  const av = e.target.closest('[data-av]');
  if (av) { pickedAv = av.dataset.av; document.querySelectorAll('.av').forEach(b => b.classList.toggle('on', b === av)); return; }
  const op = e.target.closest('[data-open]');
  if (op) { openId = op.dataset.open; render(); return; }
  const g = e.target.closest('[data-guess]');
  if (g && me) {
    const it = S.items.find(i => i.id === openId); if (!it || S.room.status !== 'voting') return;
    const { error } = await supabase.from('hub_votes').upsert([{ room_code: CODE, item_id: it.id, voter_id: me.id, data: { guess: +g.dataset.guess } }], { onConflict: 'item_id,voter_id' });
    if (error) showError(error); refresh(); return;
  }
  const rvb = e.target.closest('[data-reveal]');
  if (rvb) { rvb.disabled = true; await revealItem(rvb.dataset.reveal); return; }
  const kk = e.target.closest('[data-kick]');
  if (kk) { kk.disabled = true; const { error } = await supabase.from('hub_players').delete().eq('id', kk.dataset.kick); if (error) showError(error); refresh(); return; }
  const a = e.target.closest('[data-act]');
  if (a && actions[a.dataset.act]) { a.disabled = true; try { await actions[a.dataset.act](); } finally { a.disabled = false; } }
});

// ---- start ----
try {
  const t0 = Date.now(); const { data } = await supabase.rpc('hub_now');
  if (data) skew = new Date(data).getTime() - (t0 + Date.now()) / 2;
} catch {}
await ensureRoom(CODE, 'ttl', 'lobby', {});
await refresh();
subscribeRoom(CODE, { rooms: soon, players: soon, items: soon, votes: soon });
setInterval(refresh, 4000);
</script>
</body>
</html>
