<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forbidden Words</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#000; --fg:#fff; --red:#d42a1a; --redl:#ff6b5b; --gray:#5b6063; --dark:#1c1c1c; --muted:#b8bcbf; --ok:#4ade80;
    --card-top:#c8e6dc; --card-bot:#ea580c;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:'Bricolage Grotesque',system-ui,sans-serif; line-height:1.4; border-top:10px solid var(--gray); }
  body[data-phase=playing] { border-top-color:var(--red); } body[data-phase=podium] { border-top-color:#fff; }
  main { max-width:860px; margin:0 auto; padding:56px 18px 90px; }
  h1 { font-size:clamp(1.8rem,6vw,2.8rem); font-weight:800; margin:0 0 6px; line-height:1.05; }
  h2 { font-size:1.3rem; margin:0 0 10px; }
  .back { position:fixed; top:14px; left:10px; font:800 12px system-ui; background:#fff; color:#000; padding:5px 12px; border-radius:99px; text-decoration:none; z-index:5; }
  .box { border:3px solid #fff; box-shadow:6px 6px 0 #3a3d3f; background:var(--dark); padding:18px; margin:18px 0; }
  .muted { color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:2px solid #fff; padding:3px 10px; font-weight:800; background:var(--gray); }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; border:3px solid #fff; background:transparent; font-weight:800; padding:10px 18px; }
  button.main { background:var(--red); } button.main:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--redl); outline-offset:2px; }
  input[type=text], input[type=number] { width:100%; padding:10px; border:3px solid #fff; background:#000; }
  input[type=number] { width:100px; }
  .avs { display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr)); gap:8px; margin:10px 0 16px; }
  .av { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; padding:0; font-size:1.8rem; line-height:1; border:3px solid transparent; }
  .av.on { border-color:#fff; background:var(--gray); }
  .row { display:flex; gap:12px; align-items:center; margin:12px 0; flex-wrap:wrap; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:12px 0; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:6px; padding:18px 10px; font-size:1.05rem; text-align:center; }
  .tile .big { font-size:3.2rem; line-height:1; }
  .tile.on { background:var(--red); }

  /* Two-tone Taboo Card (Student Phone View) */
  .tcard-wrap { margin:22px 0; }
  .tcard { border:3px solid #fff; box-shadow:6px 6px 0 #3a3d3f; overflow:hidden; position:relative; transition:transform .12s, box-shadow .12s, opacity .2s; }
  .tcard.done-ok { border-color:var(--ok); }
  .tcard.done-no { opacity:.6; }
  .tcard-head { background:var(--card-top); color:#0a1f18; padding:18px 20px; text-align:center; border-bottom:4px solid #000; position:relative; }
  .tcard-num { position:absolute; left:12px; top:10px; font-size:.8rem; font-weight:800; background:#000; color:#fff; padding:2px 8px; }
  .tcard-word { font-size:clamp(1.6rem,5.5vw,2.3rem); font-weight:800; letter-spacing:-.01em; margin:6px 0 0; }
  .tcard-body { background:var(--card-bot); color:#fff; padding:18px 20px 24px; text-align:center; }
  .tcard-label { font-size:.82rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin:0 0 12px; opacity:.95; }
  .tcard-ban { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; font-size:1.35rem; font-weight:800; text-shadow:1px 1px 0 rgba(0,0,0,.35); }

  /* Host Interactive Clickable Cards Grid */
  .host-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; margin-top:12px; }
  .hcard { display:block; width:100%; padding:0; text-align:center; border:3px solid #fff; box-shadow:5px 5px 0 #3a3d3f; overflow:hidden; position:relative; transition:transform .1s, box-shadow .1s; }
  .hcard:hover { transform:translate(2px,2px); box-shadow:3px 3px 0 #3a3d3f; }
  .hcard:disabled { opacity:.6; cursor:wait; }
  .hcard .hcard-head { background:var(--card-top); color:#0a1f18; padding:12px 10px; border-bottom:3px solid #000; font-size:1.25rem; font-weight:800; }
  .hcard .hcard-body { background:var(--card-bot); color:#fff; padding:10px 10px 14px; }
  .hcard .hcard-lbl { font-size:.68rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin:0 0 6px; opacity:.9; }
  .hcard .hcard-ban { list-style:none; padding:0; margin:0; font-size:.95rem; font-weight:800; line-height:1.35; }
  .hcard.state-valid { border-color:var(--ok); }
  .hcard.state-invalid { border-color:var(--red); opacity:.75; }

  /* Big Check / Cross Stamp Overlay */
  .stamp {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:4.5rem; font-weight:800; pointer-events:none;
    background:rgba(0,0,0,.48); text-shadow:0 4px 12px rgba(0,0,0,.8);
  }
  .stamp.ok { color:var(--ok); }
  .stamp.no { color:#ff4d4d; }

  .timer { font-size:2.4rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .big { font-size:1.35rem; font-weight:800; }
  .rank { display:flex; gap:12px; padding:10px 0; border-bottom:2px solid #fff; font-weight:800; font-size:1.15rem; }
  .rank.me { background:var(--red); padding-left:8px; } .rank .s { margin-left:auto; }

  /* Score Bar Chart */
  .chart { display:flex; flex-direction:column; gap:12px; margin-top:14px; }
  .chart-row { display:flex; flex-direction:column; gap:4px; }
  .chart-meta { display:flex; justify-content:space-between; font-weight:800; font-size:.95rem; }
  .chart-track { width:100%; height:26px; background:#000; border:2px solid #fff; padding:2px; }
  .chart-bar { height:100%; background:var(--red); transition:width .4s ease-out; min-width:4px; }
  .chart-bar.top { background:var(--ok); }

  .fab { position:fixed; right:12px; bottom:12px; z-index:6; background:#000; box-shadow:4px 4px 0 #3a3d3f; }
  .x { padding:2px 8px; border:none; font-size:1rem; }
  .qr { display:inline-block; background:#fff; padding:12px; margin:6px 0; }
  #err { position:fixed; left:0; right:0; bottom:0; background:#fde047; color:#000; padding:10px 16px; font-weight:500; display:none; z-index:9; }
</style>
</head>
<body>
<a class="back" href="./">← Games</a>
<main><h1>Forbidden Words <small style="font-size:.9rem;font-weight:500">v1</small></h1><div id="app"><p class="muted">Loading…</p></div></main>
<div id="err" role="alert"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { supabase, ensureRoom, joinRoom, subscribeRoom, patchRoom, roomCodeFromUrl } from "./supabase.js";
import { getSid, savedName, savedAvatar, rememberPlayer, recordScores, newRoundId } from "./scoreboard.js";

const CODE = roomCodeFromUrl("TABOO-1001");
const AV = ["🦊","🐼","🐸","🦄","🐙","🦁","🐯","🐵","🐧","🦉","🐢","🐳","🦋","🐝","🦖","👾"];
const CATS = {
  verbs:   { icon: '⚡', label: 'Advanced Verbs', desc: 'C1/C2 Action & Abstract Verbs' },
  objects: { icon: '🏚️', label: 'House, Warehouse & Farm', desc: 'Specific Tools, Gear & Objects' }
};

// [Target Word, [5 Forbidden Words]]
const RAW = {
  verbs: [
    ['Procrastinate', ['delay', 'postpone', 'later', 'lazy', 'work']],
    ['Embellish',     ['decorate', 'exaggerate', 'story', 'add', 'details']],
    ['Scrutinize',    ['examine', 'inspect', 'closely', 'look', 'check']],
    ['Improvise',     ['plan', 'prepare', 'script', 'spontaneous', 'invent']],
    ['Sabotage',      ['destroy', 'ruin', 'damage', 'secretly', 'plan']],
    ['Alleviate',     ['pain', 'reduce', 'relief', 'ease', 'less']],
    ['Collaborate',   ['work', 'together', 'team', 'partner', 'cooperate']],
    ['Deteriorate',   ['worse', 'decline', 'decay', 'break', 'condition']],
    ['Exaggerate',    ['overstate', 'bigger', 'truth', 'dramatic', 'more']],
    ['Fluctuate',     ['change', 'up', 'down', 'price', 'unstable']],
    ['Hesitate',      ['pause', 'wait', 'unsure', 'doubt', 'stop']],
    ['Intimidate',    ['scare', 'frighten', 'bully', 'fear', 'threat']],
    ['Jeopardize',    ['risk', 'danger', 'threaten', 'lose', 'harm']],
    ['Manipulate',    ['control', 'influence', 'trick', 'use', 'people']],
    ['Negotiate',     ['deal', 'agree', 'price', 'talk', 'compromise']],
    ['Overwhelm',     ['too much', 'stress', 'bury', 'emotion', 'handle']],
    ['Persevere',     ['continue', 'try', 'give up', 'hard', 'keep']],
    ['Reconcile',     ['forgive', 'friends', 'fight', 'agree', 'peace']],
    ['Speculate',     ['guess', 'theory', 'know', 'future', 'think']],
    ['Undermine',     ['weaken', 'authority', 'secretly', 'trust', 'support']],
    ['Validate',      ['confirm', 'prove', 'true', 'check', 'accept']],
    ['Withstand',     ['resist', 'survive', 'strong', 'endure', 'force']],
    ['Accumulate',    ['gather', 'collect', 'more', 'pile', 'build']],
    ['Baffle',        ['confuse', 'puzzle', 'understand', 'mystery', 'strange']],
    ['Contemplate',   ['think', 'deeply', 'consider', 'stare', 'future']]
  ],
  objects: [
    ['Pallet Jack',      ['warehouse', 'lift', 'wheels', 'wood', 'forklift']],
    ['Silo',             ['farm', 'grain', 'tower', 'tall', 'store']],
    ['Chandelier',       ['ceiling', 'lights', 'hanging', 'crystal', 'luxury']],
    ['Wheelbarrow',      ['garden', 'push', 'wheel', 'dirt', 'carry']],
    ['Forklift',         ['warehouse', 'heavy', 'lift', 'machine', 'drive']],
    ['Colander',         ['pasta', 'drain', 'water', 'holes', 'kitchen']],
    ['Pitchfork',        ['hay', 'farm', 'sharp', 'handle', 'barn']],
    ['Thermostat',       ['temperature', 'heat', 'cold', 'wall', 'control']],
    ['Ratchet Strap',    ['tie', 'cargo', 'truck', 'tighten', 'secure']],
    ['Incubator',        ['eggs', 'warm', 'hatch', 'chicks', 'farm']],
    ['Dehumidifier',     ['water', 'air', 'moisture', 'damp', 'room']],
    ['Barcode Scanner',  ['laser', 'beep', 'price', 'inventory', 'read']],
    ['Trough',           ['animals', 'drink', 'water', 'feed', 'livestock']],
    ['Circuit Breaker',  ['electricity', 'power', 'switch', 'box', 'fuse']],
    ['Shrink Wrap',      ['plastic', 'roll', 'pallet', 'cover', 'pack']],
    ['Scarecrow',        ['birds', 'field', 'straw', 'clothes', 'frighten']],
    ['Caulking Gun',     ['seal', 'gap', 'tube', 'squeeze', 'silicone']],
    ['Conveyor Belt',    ['move', 'factory', 'warehouse', 'boxes', 'rolling']],
    ['Milking Parlor',   ['cows', 'dairy', 'barn', 'machine', 'farm']],
    ['Deadbolt',         ['lock', 'door', 'key', 'security', 'metal']],
    ['Loading Dock',     ['truck', 'warehouse', 'unload', 'door', 'cargo']],
    ['Cistern',          ['rain', 'water', 'tank', 'underground', 'store']],
    ['Mortar and Pestle',['crush', 'grind', 'spices', 'bowl', 'kitchen']],
    ['Hand Truck',       ['dolly', 'boxes', 'two wheels', 'tilt', 'move']],
    ['Weathervane',      ['wind', 'roof', 'direction', 'rooster', 'spin']]
  ]
};

const CARDS = {};
Object.entries(RAW).forEach(([cat, arr]) => arr.forEach((r, i) => {
  const id = cat[0] + i;
  CARDS[id] = { id, cat, word: r[0], ban: r[1] };
}));
const idsOf = cat => Object.values(CARDS).filter(c => c.cat === cat).map(c => c.id);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sid = getSid(); // same id in every game -> shared class scoreboard
let hostMode = false;
try { hostMode = localStorage.getItem('taboo_host_' + CODE) === '1' || new URLSearchParams(location.search).get('host') === '1'; } catch {}
let S = { room: null, players: [] }, me = null, skew = 0, lastKey = '', pickedAv = AV.includes(savedAvatar()) ? savedAvatar() : AV[0], cat = 'verbs';
let showKey = false; // host screen never shows the words unless the teacher asks, after the round

function showError(e) {
  const t = $('#err'); if (!e) { t.style.display = 'none'; return; }
  const m = e.message || String(e);
  t.textContent = (/hub_|relation|schema|42P01|42501|PGRST|foreign key/.test(m + (e.code || '')) ? 'Database not ready: run add_taboo_game.sql. ' : '') + m;
  t.style.display = 'block';
}

async function refresh() {
  const [r, p] = await Promise.all([
    supabase.from('hub_rooms').select('*').eq('code', CODE).maybeSingle(),
    supabase.from('hub_players').select('*').eq('room_code', CODE).order('joined_at')
  ]);
  const err = r.error || p.error;
  if (err) { showError(err); return; }
  showError(null);
  S = { room: r.data, players: p.data || [] };
  me = S.players.find(x => x.session_id === sid) || null;
  render();
}
let deb; const soon = () => { clearTimeout(deb); deb = setTimeout(refresh, 150); };

const st = () => (S.room && S.room.state) || {};
const pTag = p => p ? `${esc(p.avatar || '🙂')} ${esc(p.name)}` : '?';
const remaining = () => { const e = st().ends_at; return e ? Math.max(0, Math.ceil((new Date(e).getTime() - (Date.now() + skew)) / 1000)) : 0; };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const myHand = () => (me && st().hands && st().hands[me.id]) || [];

function viewKey() {
  if (!S.room) return 'none';
  const sc = S.players.map(p => p.id + ':' + p.score).join(',') + '|' + JSON.stringify(st().grades || {});
  return [S.room.status, hostMode, me && me.id, st().ends_at, sc, showKey].join('|');
}

function render() {
  if (!S.room) { $('#app').innerHTML = '<p class="muted">Could not open the room.</p>'; return; }
  document.body.dataset.phase = S.room.status;
  const k = viewKey();
  if (k !== lastKey) { lastKey = k; $('#app').innerHTML = view(); qr(); }
  light();
}

function light() {
  const pl = $('#plist'); if (pl) pl.innerHTML = S.players.map(p => `<span class="chip">${pTag(p)}${hostMode ? ` <button class="x" data-kick="${p.id}" aria-label="Remove ${esc(p.name)}">✕</button>` : ''}</span>`).join('') || '<i class="muted">Nobody yet…</i>';
  const sg = $('#startgame'); if (sg) sg.disabled = S.players.length < 1;
  tick();
}

function qr() {
  const el = $('#qr'); if (!el || el.dataset.done) return;
  if (!window.QRCode) { el.textContent = '(QR unavailable: use the link)'; return; }
  el.dataset.done = '1';
  new QRCode(el, { text: location.origin + location.pathname + '?room=' + encodeURIComponent(CODE), width: 230, height: 230, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}

function tick() {
  const t = $('#timer'); if (t) t.textContent = fmt(remaining());
  if (S.room && S.room.status === 'playing' && st().ends_at && remaining() <= 0) {
    const n = $('#late'); if (n) n.hidden = false;
  }
}
setInterval(tick, 500);

function view() {
  const s = S.room.status;
  if (hostMode) return hostView(s) + '<button class="ghost fab" data-act="reset">↺ Reset game</button>';
  return me ? playerView(s) : joinView();
}

function joinView() {
  return `<div class="box"><h2>Join room <code>${esc(CODE)}</code></h2>
    <label for="nm"><b>Your name</b></label><input id="nm" type="text" maxlength="30" autocomplete="off" value="${esc(savedName())}">
    <p><b>Your avatar</b></p><div class="avs">${AV.map(a => `<button type="button" class="av ${a === pickedAv ? 'on' : ''}" data-av="${a}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
    <button class="main" data-act="join">Join</button></div>
    <p><button class="ghost" data-act="host">I'm the host (projector)</button></p>`;
}

function sortedRows() {
  return [...S.players].sort((a, b) => b.score - a.score || new Date(a.joined_at) - new Date(b.joined_at));
}

function rankHtml() {
  const rows = sortedRows();
  return rows.map((p, i) => `<div class="rank ${me && p.id === me.id ? 'me' : ''}"><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'}</span><span>${pTag(p)}</span><span class="s">${p.score} pts</span></div>`).join('') || '<p class="muted">No players.</p>';
}

function chartHtml() {
  const rows = sortedRows();
  if (!rows.length) return '';
  const perPlayer = st().perPlayer || 2;
  const maxPossible = Math.max(perPlayer * 100, ...rows.map(p => p.score), 100);
  const topScore = rows[0].score;
  return `<div class="box"><h2>📊 Score Chart</h2><div class="chart">${rows.map(p => {
    const pct = Math.round((p.score / maxPossible) * 100);
    const isTop = p.score > 0 && p.score === topScore;
    return `<div class="chart-row">
      <div class="chart-meta"><span>${pTag(p)}</span><span>${p.score} pts (${pct}%)</span></div>
      <div class="chart-track"><div class="chart-bar ${isTop ? 'top' : ''}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('')}</div></div>`;
}

// Host clicks directly on any student's card to cycle: Unmarked -> ✓ Check (+100) -> ✕ Cross (0) -> Unmarked
function hostCardsGridHtml(reveal = false) {
  const grades = st().grades || {};
  return S.players.map(p => {
    const hand = (st().hands && st().hands[p.id]) || [];
    if (!hand.length) return '';
    return `<div class="box">
      <div class="row" style="justify-content:space-between;margin:0">
        <h2 style="margin:0">${pTag(p)}</h2>
        <span class="chip">${p.score} pts</span>
      </div>
      <div class="host-grid">${hand.map((cid, i) => {
        const card = CARDS[cid];
        if (!card) return '';
        const key = `${p.id}:${cid}`;
        const status = grades[key] || 'none';
        const stamp = status === 'valid'
          ? '<div class="stamp ok" aria-label="Correct">✓</div>'
          : status === 'invalid'
          ? '<div class="stamp no" aria-label="Wrong">✕</div>'
          : '';
        const face = reveal
          ? `<div class="hcard-head">${esc(card.word)}</div>
          <div class="hcard-body">
            <p class="hcard-lbl">Forbidden:</p>
            <ul class="hcard-ban">${card.ban.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
          </div>`
          : `<div class="hcard-head">🔒 Card ${i + 1}</div>
          <div class="hcard-body">
            <p class="hcard-lbl">Hidden on this screen</p>
            <p class="hcard-ban" style="margin:0">Tap: ✓ → ✕ → clear</p>
          </div>`;
        return `<button type="button" class="hcard state-${status}" data-toggle-card="${key}" title="Click to toggle ✓ Check (+100 pts) or ✕ Cross (0 pts)" aria-label="${esc(p.name)} card ${i + 1}: ${status === 'valid' ? 'correct' : status === 'invalid' ? 'wrong' : 'not graded'}">
          ${face}
          ${stamp}
        </button>`;
      }).join('')}</div>
    </div>`;
  }).join('');
}

function hostView(s) {
  const link = location.origin + location.pathname + '?room=' + encodeURIComponent(CODE);
  const clear = '<button class="ghost" data-act="clearnames">🧽 Clear names</button>';
  if (s === 'lobby') {
    const maxPerPlayer = Math.max(1, Math.floor(idsOf(cat).length / Math.max(1, S.players.length)));
    return `<div class="box"><h2>Room <code>${esc(CODE)}</code></h2>
      <p class="muted">Scan the QR or go to:<br><b>${esc(link)}</b></p><div class="qr" id="qr"></div><h2>Players (${S.players.length})</h2><div class="chips" id="plist"></div></div>
      <div class="box"><h2>Game panel</h2><p class="muted">1. Choose the deck category</p>
      <div class="tiles">${Object.entries(CATS).map(([k, c]) => `<button class="tile ${k === cat ? 'on' : ''}" data-cat="${k}" aria-label="${c.label}"><span class="big">${c.icon}</span><b>${c.label}</b><small class="muted">${c.desc}</small></button>`).join('')}</div>
      <p class="muted">2. Set unique cards per student & timer (25 total cards — no repeats across phones)</p>
      <div class="row"><label for="cnt"><b>Cards / person</b></label><input id="cnt" type="number" min="1" max="${maxPerPlayer}" value="${Math.min(2, maxPerPlayer)}">
      <label for="secs"><b>Seconds</b></label><input id="secs" type="number" min="30" max="1800" value="180"></div>
      <div class="row"><button class="main" id="startgame" data-act="start" disabled>Start game</button>${clear}</div>
      <p class="muted">Students explain orally from their seats. The words only appear on their phones: your screen shows hidden cards you tap to mark ✓ (+100 pts) or ✕ (0 pts).</p></div>`;
  }
  if (s === 'playing') return `<div class="box">
    <div class="row" style="justify-content:space-between;margin:0">
      <div>
        <h2 style="margin:0">${CATS[st().category]?.icon || ''} ${CATS[st().category]?.label || ''}</h2>
        <p class="muted" style="margin:4px 0 0">Click a card to stamp <b>✓ (+100 pts)</b> or <b>✕ (0 pts)</b></p>
      </div>
      <div class="timer" id="timer"></div>
    </div>
    <p id="late" class="big" style="color:#fde047;margin:8px 0 0" hidden>⏰ Time's up!</p>
  </div>
  <button class="main" data-act="results">Finish & Show Podium Chart</button>
  ${hostCardsGridHtml()}`;
  if (s === 'podium') return `<div class="box"><h2>🏆 Results</h2>${rankHtml()}</div>
    ${chartHtml()}
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">📋 Cards Graded (Click any card to adjust)</h2>
    <button class="ghost" data-act="togglekey">${showKey ? '🙈 Hide words' : '👁 Show words'}</button></div>
    ${hostCardsGridHtml(showKey)}
    <div class="row"><button class="main" data-act="reset">New game</button>${clear}</div>`;
  return '<p class="muted">Waiting…</p>';
}

function playerView(s) {
  const hello = `<p class="muted">Playing as ${pTag(me)} · <b>${me.score} pts</b></p>`;
  if (s === 'lobby') return `${hello}<div class="box"><h2>You're in 🎉</h2><p>Wait for the host to deal the cards.</p><div class="chips" id="plist"></div></div>`;
  if (s === 'playing') {
    const hand = myHand();
    if (!hand.length) return `${hello}<div class="box"><h2>Spectating this round</h2><p>You joined after cards were dealt. Listen and guess your classmates' words!</p><div class="timer" id="timer"></div></div>`;
    const grades = st().grades || {};
    return `${hello}<div class="box"><div class="timer" id="timer"></div><h2>Explain orally from your seat!</h2>
      <p class="muted">Describe each word to the class <b>without</b> saying the target word or any of the 5 forbidden words.</p>
      <p id="late" class="big" style="color:#fde047" hidden>⏰ Time's up!</p>
      ${hand.map((id, i) => {
        const card = CARDS[id];
        const status = grades[`${me.id}:${id}`] || 'none';
        const stamp = status === 'valid'
          ? '<div class="stamp ok" aria-label="Correct">✓</div>'
          : status === 'invalid'
          ? '<div class="stamp no" aria-label="Wrong">✕</div>'
          : '';
        return `<div class="tcard-wrap">
          <div class="tcard ${status === 'valid' ? 'done-ok' : status === 'invalid' ? 'done-no' : ''}">
            <div class="tcard-head">
              <span class="tcard-num">CARD ${i + 1} / ${hand.length}</span>
              <h3 class="tcard-word">${esc(card.word)}</h3>
            </div>
            <div class="tcard-body">
              <p class="tcard-label">Forbidden Words:</p>
              <ul class="tcard-ban">${card.ban.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
            </div>
            ${stamp}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  if (s === 'podium') {
    const hand = myHand();
    const grades = st().grades || {};
    const summary = hand.length ? `<div class="box"><h2>Your Cards</h2>${hand.map(cid => {
      const card = CARDS[cid];
      const status = grades[`${me.id}:${cid}`];
      return `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid #444">
        <div><strong>${esc(card.word)}</strong> <span class="muted">(${card.ban.join(', ')})</span></div>
        <div><b>${status === 'valid' ? '✓ +100 pts' : '✕ 0 pts'}</b></div>
      </div>`;
    }).join('')}</div>` : '';
    return `${hello}<div class="box"><h2>🏆 Results</h2>${rankHtml()}</div>${chartHtml()}${summary}`;
  }
  return `${hello}<p class="muted">Waiting…</p>`;
}

async function recalculateScores(grades) {
  const updates = S.players.map(p => {
    const hand = (st().hands && st().hands[p.id]) || [];
    const pts = hand.reduce((sum, cid) => sum + (grades[`${p.id}:${cid}`] === 'valid' ? 100 : 0), 0);
    return { p, pts, req: supabase.from('hub_players').update({ score: pts }).eq('id', p.id) };
  });
  await Promise.all(updates.map(u => u.req));
  await recordScores('taboo', st().round_id || st().ends_at, updates.map(u => ({ ...u.p, score: u.pts })));
}

const actions = {
  host() { try { localStorage.setItem('taboo_host_' + CODE, '1'); } catch {} hostMode = true; lastKey = ''; render(); },
  togglekey() { showKey = !showKey; render(); },
  async join() {
    const name = $('#nm').value.trim(); if (!name) { $('#nm').focus(); return; }
    const { error } = await joinRoom(CODE, sid, name, { avatar: pickedAv, status: 'joined' });
    if (error) return showError(error);
    rememberPlayer(name, pickedAv);
    refresh();
  },
  async start() {
    await refresh();
    const pool = shuffle(idsOf(cat));
    const playerCount = Math.max(1, S.players.length);
    const maxAllowed = Math.max(1, Math.floor(pool.length / playerCount));
    const perPlayer = clamp(parseInt($('#cnt').value, 10) || 2, 1, maxAllowed);
    const secs = clamp(parseInt($('#secs').value, 10) || 180, 30, 1800);

    // Deal unique, non-repeating slices of cards to each player
    const hands = {};
    S.players.forEach((p, idx) => {
      hands[p.id] = pool.slice(idx * perPlayer, (idx + 1) * perPlayer);
    });

    await supabase.from('hub_players').update({ score: 0 }).eq('room_code', CODE);
    const { error } = await supabase.rpc('hub_start_phase', {
      p_code: CODE,
      p_status: 'playing',
      p_secs: secs,
      p_reset: { category: cat, hands, perPlayer, grades: {}, scored: false, round_id: newRoundId() }
    });
    if (error) showError(error);
    refresh();
  },
  async results() {
    await refresh();
    await recalculateScores(st().grades || {});
    await patchRoom(CODE, { status: 'podium', scored: true });
    refresh();
  },
  async clearnames() {
    if (!confirm('Wash out all players and return to the lobby?')) return;
    const { error } = await supabase.from('hub_players').delete().eq('room_code', CODE);
    if (error) return showError(error);
    await patchRoom(CODE, { status: 'lobby', scored: false, hands: {}, grades: {}, ends_at: null });
    refresh();
  },
  async reset() {
    if (!confirm('Reset the whole game? All scores of this game will be cleared and everyone goes back to the lobby. (Class scoreboard totals are kept.)')) return;
    await supabase.from('hub_players').update({ score: 0 }).eq('room_code', CODE);
    showKey = false;
    await patchRoom(CODE, { status: 'lobby', scored: false, hands: {}, grades: {}, ends_at: null });
    refresh();
  }
};

document.addEventListener('click', async e => {
  const av = e.target.closest('[data-av]');
  if (av) { pickedAv = av.dataset.av; document.querySelectorAll('.av').forEach(b => b.classList.toggle('on', b === av)); return; }
  const ct = e.target.closest('[data-cat]');
  if (ct) {
    cat = ct.dataset.cat;
    document.querySelectorAll('.tile').forEach(b => b.classList.toggle('on', b === ct));
    const cnt = $('#cnt');
    if (cnt) cnt.max = Math.max(1, Math.floor(idsOf(cat).length / Math.max(1, S.players.length)));
    return;
  }
  const kk = e.target.closest('[data-kick]');
  if (kk) { kk.disabled = true; const { error } = await supabase.from('hub_players').delete().eq('id', kk.dataset.kick); if (error) showError(error); refresh(); return; }
  const tc = e.target.closest('[data-toggle-card]');
  if (tc && hostMode) {
    tc.disabled = true;
    const key = tc.dataset.toggleCard;
    const grades = { ...(st().grades || {}) };
    const cur = grades[key] || 'none';
    // Cycle: unmarked ('none') -> check ('valid') -> cross ('invalid') -> unmarked ('none')
    if (cur === 'none') grades[key] = 'valid';
    else if (cur === 'valid') grades[key] = 'invalid';
    else delete grades[key];
    await recalculateScores(grades);
    await patchRoom(CODE, { grades });
    refresh();
    return;
  }
  const a = e.target.closest('[data-act]');
  if (a && actions[a.dataset.act]) { a.disabled = true; try { await actions[a.dataset.act](); } finally { a.disabled = false; } }
});

try { const t0 = Date.now(); const { data } = await supabase.rpc('hub_now'); if (data) skew = new Date(data).getTime() - (t0 + Date.now()) / 2; } catch {}
await ensureRoom(CODE, 'taboo', 'lobby', {});
await refresh();
subscribeRoom(CODE, { rooms: soon, players: soon });
setInterval(refresh, 4000);
</script>
</body>
